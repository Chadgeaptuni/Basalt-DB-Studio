<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Basalt DB Studio">
  <title>Basalt DB Studio</title>

  <defs>
    <linearGradient id="tileFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e242c" />
      <stop offset="1" stop-color="#0d1014" />
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6675" />
      <stop offset="1" stop-color="#222a33" />
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="50" fill="url(#tileFill)" />
  <rect x="1.5" y="1.5" width="253" height="253" rx="48.5" fill="none" stroke="url(#tileEdge)" stroke-width="3" />

  <g transform="translate(128 128) scale(1.12) translate(-128 -115)">
    <!-- Outer frame: the stack's own silhouette hexagon, offset 12px outward on
         every edge, so it stays parallel to the mark all the way round. Three
         passes on one path build the band outwards from the centre:
         grey 2.5 | dark 2 | light 6 | dark 2 | grey 2.5. -->
    <g fill="none" stroke-linejoin="round">
      <path d="M46 60.1 128 35.5 210 60.1 210 169.9 128 194.5 46 169.9Z" stroke="#5b6674" stroke-width="15" />
      <path d="M46 60.1 128 35.5 210 60.1 210 169.9 128 194.5 46 169.9Z" stroke="#070a0d" stroke-width="10" />
      <path d="M46 60.1 128 35.5 210 60.1 210 169.9 128 194.5 46 169.9Z" stroke="#dfe5ec" stroke-width="6" />
    </g>

    <!-- Left/right faces are separate fills that butt at x=128; each slab's
         silhouette is one stroked path so the centre seam stays bare. -->
    <!-- Top face, hollowed at the hexagon inset 10px so the tile gradient shows
         through the ring band. -->
    <path fill="#dfe5ec" fill-rule="evenodd"
          d="M58 69 128 48 198 69 198 107 128 128 58 107Z
             M68 76.4 128 58.4 188 76.4 188 99.6 128 117.6 68 99.6Z" />

    <!-- Inner hexagon (inset 15px). -->
    <path d="M73 80.2 128 63.7 183 80.2 183 95.8 128 112.3 73 95.8Z" fill="#31629e" />

    <path d="M58 112 128 133 128 155 58 134Z" fill="#9aa5b3" />
    <path d="M198 112 198 134 128 155 128 133Z" fill="#6c7683" />

    <path d="M58 139 128 160 128 182 58 161Z" fill="#4e8cd9" />
    <path d="M198 139 198 161 128 182 128 160Z" fill="#31629e" />

    <!-- 2.5 = half the 5px slab spacing, so stroke and visible gap are equal. -->
    <g fill="none" stroke="#5b6674" stroke-width="2.5" stroke-linejoin="round">
      <path d="M58 69 128 48 198 69 198 107 128 128 58 107Z" />
      <path d="M58 112 128 133 198 112 198 134 128 155 58 134Z" />
      <path d="M58 139 128 160 198 139 198 161 128 182 58 161Z" stroke="#1f4576" />
      <path d="M68 76.4 128 58.4 188 76.4 188 99.6 128 117.6 68 99.6Z" />
      <path d="M73 80.2 128 63.7 183 80.2 183 95.8 128 112.3 73 95.8Z" stroke="#1f4576" />
    </g>
  </g>
</svg>
