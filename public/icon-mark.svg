<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" aria-label="Basalt DB Studio" viewBox="0 0 256 256"><title>Basalt DB Studio</title><g transform="translate(-15.36 -.8)scale(1.12)"><!--Outer frame: the stack's own silhouette hexagon, offset 12px outward on
