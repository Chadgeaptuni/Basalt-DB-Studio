[package]
name = "basalt-db-studio"
version = "0.1.0"
description = "Lightweight, cross-platform database GUI (PostgreSQL, MySQL/MariaDB, SQLite)"
authors = ["Basalt DB Studio contributors"]
edition = "2021"
rust-version = "1.94"
license = "GPL-3.0-only"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (Windows linker quirk,
# rust-lang/cargo#8519).
name = "basalt_db_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# File open/save dialogs for CSV/JSON import & export (M5).
tauri-plugin-dialog = "2"
# The OS version for the About tab. Used from Rust only — the JS side is never
# registered, because `app_info` already answers in one call.
tauri-plugin-os = "2"
# The plugin's own dependency, declared so `edition()` is reachable: its
# `version()` reports 10.0.26200 on Windows 11, and `edition()` is the field that
# turns that into the name a person would give. No extra weight — same crate.
os_info = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# M1 — DB drivers (sqlx) + connection config/session plumbing. All three engines
# enabled now that pg/mysql land in this slice. Combined runtime-TLS features
# were deleted in sqlx 0.9 — runtime and TLS are separate. Introspection reads
# only text/int columns, so no per-type decode features (json, uuid…) yet — those
# join `values.rs` in M2 when cells are actually decoded.
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "postgres",
    "mysql",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "chrono",
    # Cell decode (values.rs): NUMERIC/DECIMAL precision, JSON, and UUID. serde_json
    # + uuid are already deps; bigdecimal is the one new crate (precision > f64).
    "bigdecimal",
    "json",
    "uuid",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# Stream `.next()` for the fetch-side row limit (buffered query results).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
toml = "0.8"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }

# keyring, russh land in later M1 slices.

[dev-dependencies]
# The integration-test crate (tests/) drives the async service layer; dev-only,
# no bundle impact. sqlx/uuid are already normal deps and visible to tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.dev]
# Full DWARF for 538 crates dominates target/ on disk. Line tables keep readable
# backtraces (file + line) and drop only variable-inspection info, which matters
# solely under a debugger.
debug = "line-tables-only"

[profile.release]
# Official Tauri size-optimized profile (spec Performance plan). Measure "s" vs
# "z" before switching; do not touch to chase a perf issue without measuring.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
