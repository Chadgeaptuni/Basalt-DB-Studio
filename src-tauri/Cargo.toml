[package]
name = "basalt-db-studio"
version = "0.1.0"
description = "Lightweight, cross-platform database GUI (PostgreSQL, MySQL/MariaDB, SQLite)"
authors = ["Basalt DB Studio contributors"]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (Windows linker quirk,
# rust-lang/cargo#8519).
name = "basalt_db_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# M1 — DB drivers (sqlx) + connection config/session plumbing. Only the sqlite
# sqlx feature is enabled in this slice; postgres/mysql features are added when
# those engines land, so per-driver bundle cost stays measurable. Combined
# runtime-TLS features were deleted in sqlx 0.9 — runtime and TLS are separate.
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "chrono",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
toml = "0.8"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }

# keyring, russh land in later M1 slices.

[profile.release]
# Official Tauri size-optimized profile (spec Performance plan). Measure "s" vs
# "z" before switching; do not touch to chase a perf issue without measuring.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
